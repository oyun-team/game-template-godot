# Exports the Godot project to the web and checks it on every push. Once this repo is in the
# oyun-team organization, pushes to main also publish it to the site. Do not edit this file.
# Her push'ta Godot projesini web için dışa aktarır ve kontrol eder. Repo oyun-team
# organizasyonuna taşındıktan sonra main'e yapılan her push oyunu sitede yayınlar.
# Bu dosyayı değiştirme.
name: Yayınla / Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: true

jobs:
  publish:
    # The template repo itself never publishes; only repos made from it do.
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # lets GitHub vouch for this repo to the site; no passwords needed
    env:
      PUBLISH_URL: ${{ vars.OYUN_PUBLISH_URL || 'https://games.selimhantokat.com/api/publish' }}
      AUDIENCE: oyun-team-publish
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Godot önbelleği / Godot cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads

      - name: Godot'u indir / Download Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot/templates
          curl -sSfL -o /tmp/godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          mv /tmp/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          # Only the web (no threads) template is kept from the big templates file.
          curl -sSfL -o /tmp/templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j /tmp/templates.tpz templates/web_nothreads_release.zip templates/version.txt -d ~/godot/templates
          rm /tmp/godot.zip /tmp/templates.tpz

      - name: Web'e aktar / Export to web
        run: |
          DEST=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$DEST" && cp ~/godot/templates/* "$DEST/"
          mkdir -p build
          ~/godot/godot --headless --path project --import > import.log 2>&1 || true
          ~/godot/godot --headless --path project --export-release Web ../build/index.html 2>&1 | tee export.log
          if grep -qE "SCRIPT ERROR|Parse Error|ERROR:" import.log export.log; then
            echo "::error::Godot hata verdi, yukarıdaki kayda bak / Godot reported errors, see the log above"
            grep -hE -A2 "SCRIPT ERROR|Parse Error|ERROR:" import.log export.log
            exit 1
          fi
          test -f build/index.wasm
          cp web/* build/

      - name: Kontrol / Check
        run: node scripts/check.mjs

      - name: Paketle / Package
        if: github.repository_owner == 'oyun-team' && github.ref == 'refs/heads/main'
        run: |
          DIR=$(node -p "require('./game.json').dir || 'game'")
          (cd "$DIR" && zip -r -q -X ../game.zip . -x '.*' -x '*/.*')
          zip -q -X game.zip game.json
          ls -lh game.zip

      - name: Yayınla / Publish
        if: github.repository_owner == 'oyun-team' && github.ref == 'refs/heads/main'
        run: |
          TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          echo "::add-mask::$TOKEN"
          HTTP=$(curl -sS -o result.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/zip" \
            --data-binary @game.zip "$PUBLISH_URL")
          cat result.json; echo
          {
            echo "### Yayın sonucu / Publish result"
            echo '```json'; cat result.json; echo; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$HTTP" = "200"
